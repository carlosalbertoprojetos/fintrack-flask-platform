services:
  postgres:
    image: postgres:16-alpine
    container_name: sa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sa_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sa_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sa_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sa_saas
      API_PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"
    command: sh -c "npx prisma db push && node dist/index.js"
    working_dir: /app/apps/api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sa_web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  sa_postgres_data:
