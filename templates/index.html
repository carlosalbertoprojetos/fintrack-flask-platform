<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Controle de Finanças</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Controle de Finanças Pessoais</h1>
        <h3 class="text-center text-{% if saldo >= 0 %}success{% else %}danger{% endif %}">Saldo: R$ {{ saldo | round(2) }}</h3>

        <form action="/adicionar" method="post" class="mb-4">
            <div class="row">
                <div class="col-md-4">
                    <input type="text" name="descricao" class="form-control" placeholder="Descrição" required>
                </div>
                <div class="col-md-3">
                    <input type="number" step="0.01" name="valor" class="form-control" placeholder="Valor" required>
                </div>
                <div class="col-md-3">
                    <select name="tipo" class="form-control" required>
                        <option value="receita">Receita</option>
                        <option value="despesa">Despesa</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </div>
            </div>
        </form>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Tipo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for transacao in transacoes %}
                <tr>
                    <td>{{ transacao.data.strftime('%d/%m/%Y') }}</td>
                    <td>{{ transacao.descricao }}</td>
                    <td>R$ {{ transacao.valor | round(2) }}</td>
                    <td class="text-{% if transacao.tipo == 'receita' %}success{% else %}danger{% endif %}">{{ transacao.tipo.capitalize() }}</td>
                    <td>
                        <a href="/deletar/{{ transacao.id }}" class="btn btn-danger btn-sm">Deletar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
