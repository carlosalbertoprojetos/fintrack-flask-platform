<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adicionar Receita/Despesa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Adicionar Receita ou Despesa</h1>
        
        <form action="/adicionar" method="post">
            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo</label>
                <select name="tipo" id="tipo" class="form-control" required>
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <input type="text" name="descricao" id="descricao" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="valor" class="form-label">Valor</label>
                <input type="number" step="0.01" name="valor" id="valor" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="tipo_transacao" class="form-label">Categoria</label>
                <select name="tipo_transacao" id="tipo_transacao" class="form-control" required>
                    <!-- Opções serão preenchidas dinamicamente pelo Flask -->
                </select>
            </div>
            <div class="mb-3">
                <label for="transacao" class="form-label">Transação</label>
                <select name="transacao" id="transacao" class="form-control" required>
                    <!-- Opções serão preenchidas dinamicamente pelo Flask -->
                </select>
            </div>
            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="/" class="btn btn-secondary">Voltar</a>
        </form>
    </div>
</body>
</html>
