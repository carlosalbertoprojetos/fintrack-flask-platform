<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Sistema Financeiro{% endblock %}</title>

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container d-flex gap-2 justify-content-evenly">
                <a class="navbar-brand" href="#">Financeiro</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('index') }}">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('listar_grupos') }}">Grupos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('listar_descricoes') }}">Descrições</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('listar_fpgtos') }}">Formas de Pagamento</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('listar_transacoes') }}">Transações</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('listar_reposicoes') }}">Reposições</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-5">
            {% block content %}
            {% endblock %}
        </div>

        <footer class="bg-dark text-white text-center py-3">
            <p>&copy; 2025 Sistema Financeiro</p>
        </footer>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>

</html>
