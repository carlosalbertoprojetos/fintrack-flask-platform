<!DOCTYPE html>
<html
  lang="pt-br"
  class="light-style layout-menu-fixed"
  dir="ltr"
  data-theme="theme-default"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <title>{% block title %}{% endblock %} - Finanças Pessoais</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon/favicon.ico') }}?v=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon/favicon.ico') }}?v=1.0">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/favicon/favicon.ico') }}?v=1.0">
    <meta name="msapplication-TileImage" content="{{ url_for('static', filename='img/favicon/favicon.ico') }}?v=1.0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Core CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/core.css') }}"
    />
    {% block extra_css %}{% endblock %}

    <!-- Vendors CSS -->
    <!-- Removidos arquivos que não existem -->

    <!-- Helpers -->
    <script src="{{ url_for('static', filename='vendor/js/helpers.js') }}"></script>
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
  </head>

  <body>
    {% block content %}{% endblock %}

    <!-- / Layout wrapper -->

    <!-- Modal de Confirmação -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="confirmDeleteModalLabel">Confirmar Exclusão</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p id="confirmDeleteMessage">Tem certeza que deseja excluir este item?</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger btn-sm" id="confirmDeleteBtn">Excluir</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Core JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}?v=3.1"></script>
    <!-- Garantir que confirmShutdown esteja disponível -->
    <script>
      // Fallback caso scripts.js não carregue corretamente
      if (typeof window.confirmShutdown === 'undefined') {
        window.confirmShutdown = function() {
          console.error('confirmShutdown não está disponível. Verifique se scripts.js foi carregado corretamente.');
          const modal = bootstrap.Modal.getInstance(document.getElementById('shutdownModal'));
          if (modal) {
            modal.hide();
          }
          if (typeof shutdownSystem === 'function') {
            shutdownSystem();
          } else {
            window.location.href = '/shutdown';
          }
        };
      }
    </script>
    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <!-- Script para Modal de Confirmação -->
    <script>
      function showDeleteConfirmation(message, formId = null, actionUrl = null) {
        const modal = new bootstrap.Modal(document.getElementById('confirmDeleteModal'));
        const messageElement = document.getElementById('confirmDeleteMessage');
        const confirmBtn = document.getElementById('confirmDeleteBtn');
        
        messageElement.textContent = message;
        
        // Remove event listeners anteriores
        const newConfirmBtn = confirmBtn.cloneNode(true);
        confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
        
        if (formId) {
          // Se for um formulário, submete o formulário
          newConfirmBtn.addEventListener('click', function() {
            document.getElementById(formId).submit();
          });
        } else if (actionUrl) {
          // Se for uma URL, redireciona
          newConfirmBtn.addEventListener('click', function() {
            window.location.href = actionUrl;
          });
        }
        
        modal.show();
      }
    </script>
    
    {% block extra_js %}{% endblock %}
  </body>
</html>
