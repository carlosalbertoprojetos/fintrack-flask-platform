{% extends 'base.html' %}

{% block title %}Transações{% endblock %}

{% block content %}

<h1 class="text-center">Lista de Despesas</h1>

<!-- Listando as despesas -->
<table class="table">
    <a class="btn btn-primary" href="{{ url_for('transaction.add_expense') }}">Nova Despesa</a>
    <thead>
        <tr>
            <th>Nome</th>
            <th>Exclusivo</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for expense in expenses %}
        <tr>
            <td>{{ expense.name }}</td>
            <td>{{ expense.exclusive }}</td>
            <td>
                <!-- Link para editar a despesa -->
                <a href="{{ url_for('transaction.edit_expense', id=expense.id) }}" class="btn btn-warning">Editar</a>

                <!-- Link para excluir a despesa -->
                <a href="{{ url_for('transaction.delete_expense', id=expense.id) }}" class="btn btn-danger"
                    onclick="return confirm('Tem certeza que deseja excluir esta despesa?');">Excluir</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>

{% endblock %}
