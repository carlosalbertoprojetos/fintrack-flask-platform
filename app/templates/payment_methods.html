{% extends "base.html" %}
{% block content %}
<h2>Métodos de Pagamento</h2>
<a href="{{ url_for('add_payment_method') }}" class="btn btn-primary">Adicionar Método</a>
<table class="table">
    <thead>
        <tr>
            <th>Nome</th>
            <th>Ativo</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for method in methods %}
        <tr>
            <td>{{ method.name }}</td>
            <td>{{ 'Sim' if method.is_active else 'Não' }}</td>
            <td>
                <a href="{{ url_for('edit_payment_method', id=method.id) }}" class="btn btn-warning">Editar</a>
                <form action="{{ url_for('delete_payment_method', id=method.id) }}" method="post"
                    style="display:inline;">
                    <button type="submit" class="btn btn-danger"
                        onclick="return confirm('Tem certeza?')">Deletar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
